<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Turkey Trip</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/page.css">
<link rel="stylesheet" href="css/daymap.css">

<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
</head>
<body>
<!--
  PAGE SHELL
  Static structure only. Text and cards are filled in by js/app.js from content/site.json.
  Elements marked data-slot are where generated content goes: keep the attribute when restyling.
  Read AGENTS.md before adding content.
-->
<div class="page">
  <header class="profile">
    <div class="profile__identity">
      <div class="profile__avatar" data-slot="avatar"><span class="profile__initial" data-slot="initial"></span></div>
      <div>
        <p class="profile__eyebrow label" data-slot="eyebrow"></p>
        <h1 class="profile__name" data-slot="name"></h1>
        <p class="profile__tagline" data-slot="tagline"></p>
      </div>
    </div>
    <dl class="profile__stats" data-slot="stats"></dl>
  </header>

  <section class="collection-bar" aria-label="Collection progress and filters">
    <div class="progress">
      <ol class="progress__slots" data-slot="progress-slots"></ol>
      <p class="progress__caption label" data-slot="progress-caption"></p>
    </div>
    <div class="filters" role="group" aria-label="Filter by category" data-slot="filters"></div>
    <div class="views" role="group" aria-label="Group by" data-slot="views"></div>
  </section>

  <main class="trips" data-slot="trips">
    <p class="status-message">Loading the collection…</p>
  </main>

  <section class="notes">
    <h2 class="notes__title">Picked up along the way</h2>
    <ul class="notes__list" data-slot="notes"></ul>
  </section>

  <section class="badges" aria-labelledby="badges-title">
    <div class="badges__header">
      <h2 class="badges__title" id="badges-title">Badges</h2>
      <p class="badges__caption label" data-slot="badges-caption"></p>
    </div>
    <ul class="badge-list" data-slot="badges"></ul>
  </section>

  <p class="page__footer">To add more, send Claude photos or ask it to pull in another chat.</p>
</div>

<script src="js/emblems.js"></script>
<script src="js/daymap.js"></script>
<script src="js/app.js"></script>

</body>
</html>
