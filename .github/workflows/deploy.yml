# Publishes the site from main to the gh-pages branch, which GitHub Pages serves.
# PR previews live in gh-pages under pr-preview/ (see preview.yml); this keeps them.
name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: deploy-pages

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
