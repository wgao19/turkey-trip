# Publishes each pull request to its own preview address:
#   https://wgao19.github.io/turkey-trip/pr-preview/pr-<number>/
# and posts the link as a comment on the PR. The preview is removed when the PR is closed.
name: PR preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: .
          preview-branch: gh-pages
          umbrella-dir: pr-preview
